<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <h1 id="authTitle">Welcome Back</h1>
      <p id="authSub">Login to your gallery</p>

      <form id="authForm">
        <input type="text" id="name" placeholder="Full Name" style="display:none;" />
        <input type="email" id="email" placeholder="Email" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit" id="authBtn">Login</button>
      </form>

      <p class="switch-text">
        <span id="switchText">Don't have an account?</span>
        <a id="switchLink">Register</a>
      </p>

      <p id="authMsg"></p>
    </div>
  </div>

  <script>
    const API = "/api";
    const form = document.getElementById('authForm');
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const authTitle = document.getElementById('authTitle');
    const authSub = document.getElementById('authSub');
    const authBtn = document.getElementById('authBtn');
    const switchText = document.getElementById('switchText');
    const switchLink = document.getElementById('switchLink');
    const authMsg = document.getElementById('authMsg');

    let isLogin = true;

    // Switch between Login / Register
    switchLink.onclick = () => {
      isLogin = !isLogin;

      if (isLogin) {
        nameInput.style.display = "none";
        authTitle.textContent = "Welcome Back";
        authSub.textContent = "Login to your gallery";
        authBtn.textContent = "Login";
        switchText.textContent = "Don't have an account?";
        switchLink.textContent = "Register";
      } else {
        nameInput.style.display = "block";
        authTitle.textContent = "Create Account";
        authSub.textContent = "Start your gallery today";
        authBtn.textContent = "Register";
        switchText.textContent = "Already have an account?";
        switchLink.textContent = "Login";
      }
    };

    // Submit Login / Register
    form.onsubmit = async (e) => {
      e.preventDefault();

      const url = isLogin ? `${API}/auth/login` : `${API}/auth/register`;
      
      const body = {
        email: emailInput.value,
        password: passwordInput.value
      };

      if (!isLogin) {
        body.name = nameInput.value;
      }

      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          window.location = '/gallery';
        } else {
          authMsg.textContent = data.msg;
          authMsg.style.color = "#ff6b6b";
        }
      } catch (err) {
        authMsg.textContent = "Server error, try again";
        authMsg.style.color = "#ff6b6b";
      }
    };
  </script>

</body>
</html>
